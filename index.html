<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex do Canal do Camaleão</title>
<meta name="description" content="Veja os Pokémon que você capturou na live, suas fitas e amizades.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --sun1: #ffc85c; --sun2: #ff8a3d; --moon1: #a493ff; --moon2: #57c6ff; --rosa: #ff7ab8; --txt2: #c9c0ea;
          --card: rgba(255,255,255,.06); --borda: rgba(255,255,255,.12); }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; color: #fbf8ff; font: 400 15px/1.5 "Poppins", sans-serif;
    background: radial-gradient(circle at 10% -10%, #4a2a8a, transparent 50%), radial-gradient(circle at 100% 110%, #173f75, transparent 50%), #120a2a; background-attachment: fixed; }
  a { color: var(--moon2); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 16px 60px; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .orbs { display: flex; } .orbs i { width: 38px; height: 38px; border-radius: 50%; display: block; }
  .orbs i:first-child { background: radial-gradient(circle at 35% 35%, #fff3cf, var(--sun1) 40%, var(--sun2)); box-shadow: 0 0 22px rgba(255,200,92,.6); }
  .orbs i:last-child { margin-left: -10px; background: radial-gradient(circle at 35% 35%, #e9e4ff, var(--moon1) 45%, #3c2a8a); box-shadow: 0 0 22px rgba(164,147,255,.6); }
  h1 { font: 700 clamp(26px, 5vw, 40px)/1.1 "Fredoka", sans-serif; }
  h1 span { background: linear-gradient(90deg, var(--sun1), var(--rosa), var(--moon2)); -webkit-background-clip: text; color: transparent; }
  h2 { font: 600 22px "Fredoka", sans-serif; margin: 30px 0 12px; }
  .sub { color: var(--txt2); }
  .busca { margin-top: 14px; display: flex; gap: 8px; }
  .topo { margin-top: 18px; display: flex; gap: 6px; flex-wrap: wrap; padding: 6px; border-radius: 18px; background: rgba(0,0,0,.25); border: 1px solid var(--borda); }
  .topo a { flex: 1; min-width: max-content; text-align: center; padding: 10px 14px; border-radius: 13px; color: var(--txt2); text-decoration: none;
    font: 600 15px "Fredoka", "Poppins", sans-serif; }
  .topo a:hover { background: rgba(255,255,255,.06); color: #fff; }
  .topo a.on { background: linear-gradient(90deg, rgba(255,200,92,.25), rgba(164,147,255,.25)); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .grupo-fitas { margin-top: 22px; }
  .fita.misterio img { filter: brightness(0) drop-shadow(0 0 6px rgba(170,120,255,.8)); opacity: .55; animation: fantasma 3s ease-in-out infinite; }
  .fita.misterio small { font-style: italic; }
  @keyframes fantasma { 50% { opacity: .25; transform: translateY(-3px); } }
  .grupo-fitas h3 { font: 600 18px "Fredoka", "Poppins", sans-serif; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
  .grupo-fitas h3 small { color: var(--txt2); font: 400 13px "Poppins"; }
  .secao { margin-top: 18px; }
  .secao p { margin: 6px 0; }
  .tabela { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  .tabela td, .tabela th { padding: 8px 10px; border-top: 1px solid var(--borda); text-align: left; vertical-align: top; }
  .tabela th { color: var(--txt2); font-weight: 500; }
  .tabela code { color: var(--sun1); font: 600 14px "Fredoka", "Poppins", sans-serif; white-space: nowrap; }
  .tabela img { width: 26px; height: 26px; vertical-align: middle; margin-right: 6px; object-fit: contain; }
  .atalhos { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
  .atalhos a { background: var(--card); border: 1px solid var(--borda); border-radius: 999px; padding: 6px 12px; color: inherit; text-decoration: none; font-size: 14px; }
  .atalhos a:hover { border-color: var(--sun1); }
  .bolas-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
  .bola-card { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 10px 12px; }
  .bola-card img { width: 44px; height: 44px; object-fit: contain; image-rendering: pixelated; flex: none; }
  .bola-card b { display: block; }
  .bola-card small { display: block; opacity: .85; font-size: 13px; margin: 2px 0 6px; }
  .tag-bola { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: rgba(255,200,90,.16); color: var(--sun1); }
  .tag-bola.gratis { background: rgba(120,220,140,.16); color: #8fe3a2; }
  .tag-bola.sub { background: rgba(170,140,255,.18); color: var(--moon2); }
  .tag-bola code { color: inherit; font-size: 11.5px; }
  /* reputação */
  .reputacao { display: flex; gap: 18px; align-items: flex-start; margin-top: 18px; padding: 16px 18px; border-radius: 18px; position: relative; overflow: hidden;
    background: linear-gradient(120deg, color-mix(in srgb, var(--c) 16%, transparent), var(--card)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
  .reputacao::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.08) 50%, transparent 60%); background-size: 250% 100%; animation: rep-luz 5s linear infinite; }
  .rep-ico { position: relative; display: inline-grid; place-items: center; width: 24px; height: 24px; vertical-align: middle; margin-right: 6px; }
  .rep-ico img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; position: relative; z-index: 1;
    filter: drop-shadow(0 0 4px var(--c)) drop-shadow(0 0 10px var(--c)); animation: rep-brilho 2.4s ease-in-out infinite; }
  .rep-ico::before { content: ""; position: absolute; inset: -30%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 55%, transparent), transparent 65%);
    animation: rep-pulso 2.4s ease-in-out infinite; }
  .rep-ico.grande { width: 84px; height: 84px; flex: none; margin: 0; }
  .rep-ico.grande::after { content: ""; position: absolute; inset: -14%; border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--c) 60%, transparent); animation: rep-gira 14s linear infinite; }
  .rep-ico.mini { width: 26px; height: 26px; }
  .rep-ico img.ovo-rep { image-rendering: pixelated; }
  .rep-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .rep-topo { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .rep-rot { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; opacity: .7; }
  .rep-nome { font: 700 24px "Fredoka", "Poppins", sans-serif; color: var(--c); text-shadow: 0 0 14px color-mix(in srgb, var(--c) 60%, transparent); }
  .rep-pts { margin-left: auto; font-weight: 700; opacity: .9; }
  .rep-barra { height: 12px; border-radius: 8px; background: rgba(255,255,255,.08); margin: 8px 0 6px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .rep-barra i { display: block; height: 100%; border-radius: 8px; position: relative; overflow: hidden;
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 55%, #fff 0%), var(--c)); box-shadow: 0 0 12px var(--c); }
  .rep-barra i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
    width: 40%; animation: rep-corre 2.2s ease-in-out infinite; }
  .rep-info > small { opacity: .85; }
  .rep-det { margin-top: 8px; }
  .rep-det summary { cursor: pointer; font-size: 13px; opacity: .85; }
  .rep-linhas { display: grid; gap: 4px; margin-top: 8px; }
  .rep-linhas div { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .rep-linhas small { display: block; font-size: 12px; opacity: .65; }
  .rep-linhas .mais { color: #8fe3a2; } .rep-linhas .menos { color: #ff7a7a; }
  .rep-linhas b small { display: inline; }
  @keyframes rep-brilho { 50% { filter: drop-shadow(0 0 7px var(--c)) drop-shadow(0 0 18px var(--c)); transform: scale(1.05); } }
  @keyframes rep-pulso { 50% { opacity: .45; transform: scale(1.15); } }
  @keyframes rep-gira { to { transform: rotate(360deg); } }
  @keyframes rep-corre { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
  @keyframes rep-luz { from { background-position: 150% 0; } to { background-position: -100% 0; } }
  .niveis-rep { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 10px; }
  .niveis-rep div { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 8px 10px; font-size: 14px; }
  .niveis-rep b { color: var(--c); }
  .faq { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; margin-top: 8px; }
  .faq summary { cursor: pointer; padding: 12px 14px; font-weight: 600; }
  .faq div { padding: 0 14px 12px; font-size: 14px; opacity: .9; }
  .faq code { color: var(--sun1); }
  .faq a { color: var(--moon2); }
  h2[id] { scroll-margin-top: 16px; }
  .passos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
  .passos div { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 12px; font-size: 14px; }
  .passos code, .sub code, .tabela td code { color: var(--sun1); font: 600 14px "Fredoka", "Poppins", sans-serif; }
  .passos a, .sub a { color: var(--moon2); }
  .passos b:first-child { display: block; font: 600 26px "Fredoka", "Poppins", sans-serif; color: var(--sun1); }
  .busca input { flex: 1; min-width: 0; font: 500 16px "Poppins", sans-serif; color: #fff; background: rgba(0,0,0,.3); border: 1px solid var(--borda);
    border-radius: 999px; padding: 12px 18px; outline: none; }
  .busca input:focus { border-color: var(--moon1); }
  button, .btn { font: 600 15px "Fredoka", sans-serif; color: #1a1033; border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer;
    background: linear-gradient(90deg, var(--sun1), var(--sun2)); }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 20px; padding: 18px; }

  /* perfil */
  .perfil { margin-top: 22px; display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: center; }
  .perfil .foto { position: relative; aspect-ratio: 1; border-radius: 24px; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle, rgba(255,255,255,.18), transparent 70%); }
  .perfil.sol .foto { background: radial-gradient(circle, rgba(255,200,92,.35), transparent 70%); }
  .perfil.lua .foto { background: radial-gradient(circle, rgba(164,147,255,.4), transparent 70%); }
  .perfil .foto img { width: 92%; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
  .perfil .nome { font: 700 34px/1.1 "Fredoka", sans-serif; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .time { font: 600 13px "Fredoka", sans-serif; letter-spacing: .08em; text-transform: uppercase; padding: 3px 12px; border-radius: 999px; }
  .time.sol { background: linear-gradient(90deg, var(--sun1), var(--sun2)); color: #2a1300; }
  .time.lua { background: linear-gradient(90deg, var(--moon1), var(--moon2)); color: #120a2a; }
  .parc { margin-top: 4px; color: var(--txt2); }
  .nums { margin-top: 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .num { background: rgba(0,0,0,.25); border-radius: 14px; padding: 10px 12px; }
  .num b { display: block; font: 700 26px/1.1 "Fredoka", sans-serif; }
  .num small { color: var(--txt2); font-size: 12px; }
  .barra { height: 8px; border-radius: 9px; background: rgba(255,255,255,.1); margin-top: 6px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: linear-gradient(90deg, var(--moon2), var(--rosa), var(--sun1)); }

  /* abas */
  .abas { margin-top: 26px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--borda); }
  .abas button { background: none; color: var(--txt2); border-radius: 12px 12px 0 0; padding: 10px 16px; }
  .abas button.on { background: var(--card); color: #fff; box-shadow: inset 0 -3px 0 var(--sun1); }
  .filtros { margin: 14px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filtros label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--card); cursor: pointer; font-size: 14px; }
  .filtros input[type=search] { flex: 1; min-width: 160px; font: 14px "Poppins"; color: #fff; background: rgba(0,0,0,.3); border: 1px solid var(--borda); border-radius: 999px; padding: 7px 14px; }

  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .pk { position: relative; background: var(--card); border: 1px solid var(--borda); border-radius: 16px; padding: 8px 8px 10px; text-align: center; }
  .pk img { width: 100%; aspect-ratio: 1; object-fit: contain; }
  .pk .n { font-size: 11px; color: var(--txt2); }
  .pk b { display: block; font: 600 14px/1.2 "Fredoka", sans-serif; }
  .pk .q { position: absolute; top: 6px; right: 8px; font: 600 12px "Fredoka", "Poppins", sans-serif; color: var(--txt2); }
  .pk.tem { cursor: pointer; transition: transform .15s; } .pk.tem:hover { transform: translateY(-3px); }
  .pk .fz { display: inline-block; margin-top: 4px; font: 600 11.5px "Fredoka", "Poppins", sans-serif; padding: 1px 8px; border-radius: 999px; background: rgba(255,255,255,.08); }
  .f-perf { --fc: #ff7ad9; } .f-inc { --fc: #ffd34d; } .f-oti { --fc: #8fe3a2; } .f-bom { --fc: #7fb8ff; } .f-raz { --fc: #c9c9d6; } .f-fra { --fc: #ff8f8f; }
  .pk .fz { color: var(--fc); }
  .pk .fz.f-perf { background: linear-gradient(90deg, rgba(255,122,217,.25), rgba(127,184,255,.25)); box-shadow: 0 0 10px rgba(255,122,217,.4); }
  .ficha-fundo { position: fixed; inset: 0; z-index: 50; background: rgba(8,4,20,.7); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; }
  .ficha { position: relative; width: min(520px, 100%); max-height: 88vh; overflow: auto; background: #1d1433; border: 1px solid var(--borda); border-radius: 20px; padding: 18px; }
  .fechar-ficha { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.1); color: #fff; width: 32px; height: 32px; border-radius: 50%; }
  .ficha-topo { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .ficha-topo img { width: 96px; height: 96px; object-fit: contain; }
  .ficha-topo h3 { margin: 0; font: 700 24px "Fredoka", "Poppins", sans-serif; }
  .ficha-topo span, .ficha-topo small { color: var(--txt2); font-size: 13px; }
  .ind { background: var(--card); border: 1px solid var(--borda); border-left: 4px solid var(--fc); border-radius: 14px; padding: 10px 12px; margin-top: 8px; }
  .ind.f-perf { box-shadow: 0 0 16px rgba(255,122,217,.35); }
  .ind-cab { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .ind-cab .nota { color: var(--fc); font-weight: 600; } .ind-cab .pct { margin-left: auto; font: 700 18px "Fredoka", "Poppins", sans-serif; color: var(--fc); }
  .ind-cab .sh { color: #ffe27a; font-size: 12px; }
  .ivs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .ivs > div { display: grid; grid-template-columns: 74px 1fr 22px; gap: 6px; align-items: center; font-size: 12px; }
  .ivs span { color: var(--txt2); } .ivs em { font-style: normal; text-align: right; font-weight: 600; }
  .iv-barra { height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
  .iv-barra i { display: block; height: 100%; background: var(--fc); border-radius: 4px; }
  .iv-barra i.max { background: linear-gradient(90deg, #ff7ad9, #7fb8ff); box-shadow: 0 0 6px #ff7ad9; }
  .quando { display: block; margin-top: 6px; color: var(--txt2); font-size: 11.5px; }
  .ficha-dica { margin-top: 12px; font-size: 13px; }
  @media (max-width: 520px) { .ivs { grid-template-columns: 1fr; } }
  .pk.shiny { border-color: rgba(255,246,194,.7); box-shadow: 0 0 16px rgba(255,210,240,.35); }
  .pk.shiny::after { content: "✦"; position: absolute; top: 4px; left: 8px; color: #fff6c2; text-shadow: 0 0 8px #ffd2f0; }
  .pk.lend { border-color: rgba(255,200,92,.6); }
  .pk.falta img { filter: brightness(0) opacity(.22); image-rendering: pixelated; }
  .pk.falta b { color: rgba(255,255,255,.35); }
  .fitas { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .fita { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--borda); border-radius: 16px; padding: 10px 12px; }
  .fita img { width: 46px; height: 46px; object-fit: contain; }
  .fita b { font: 600 15px "Fredoka", "Poppins", sans-serif; display: block; }
  .fita small { color: var(--txt2); font-size: 12px; line-height: 1.3; display: block; }
  .fita.falta img { filter: grayscale(1) opacity(.3); }
  .fita.falta b { color: rgba(255,255,255,.45); }
  .fita.escolhida { border-color: var(--sun1); }
  .lista { display: grid; gap: 8px; }
  .item { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 10px 14px; }
  .item img { width: 34px; height: 34px; object-fit: contain; }
  .item .cor { color: #ff7ab8; letter-spacing: 1px; }
  .explica-amizade { margin-top: 14px; background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
  .explica-amizade .escala { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .explica-amizade .escala span { background: rgba(255,122,184,.12); border-radius: 10px; padding: 4px 10px; font-size: 13px; }
  .explica-amizade .escala i { color: #ff7ab8; font-style: normal; margin-right: 6px; letter-spacing: 1px; }
  .item.amigo { align-items: center; }
  .info-amigo { flex: 1; min-width: 0; }

  .prog { height: 7px; border-radius: 4px; background: rgba(255,255,255,.1); margin-top: 6px; overflow: hidden; }

  .item a { color: #fff; text-decoration: none; font-weight: 600; }

  .vazio { color: var(--txt2); padding: 20px 0; }

  .tag img { width: 26px; height: 26px; object-fit: contain; margin: -4px 0; }
  .tag small { color: var(--txt2); }
  .time6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .slot { position: relative; aspect-ratio: .85; border-radius: 18px; background: linear-gradient(160deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
    border: 1px solid var(--borda); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; text-align: center; }
  .slot img { width: 90%; aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(0,0,0,.4)); }

  .slot.shiny { border-color: rgba(255,246,194,.7); box-shadow: 0 0 16px rgba(255,210,240,.35); }
  .slot.shiny::after { content: "✦"; position: absolute; top: 6px; left: 10px; color: #fff6c2; text-shadow: 0 0 8px #ffd2f0; }
  .slot.vago { border-style: dashed; color: var(--txt2); font-size: 12px; }
  .slot.vago::before { content: ""; width: 34%; aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.15);
    background: linear-gradient(rgba(255,255,255,.06) 46%, rgba(255,255,255,.15) 46% 54%, transparent 54%); }
  .perfil .foto .treinador { width: 70%; filter: drop-shadow(0 10px 12px rgba(0,0,0,.5)); }
  .perfil .foto .parceiro { position: absolute; right: 2%; bottom: 2%; width: 46%; }
  .perfil .foto .parceiro.so { position: static; width: 92%; }
  .perfil .foto .parceiro.ovo { width: 30%; image-rendering: pixelated; animation: ovo 3.2s ease-in-out infinite; transform-origin: 50% 85%; }
  .perfil .foto .parceiro.ovo.so { width: 45%; }

<body>
<div class="wrap">
  <header>
    <div class="orbs"><i></i><i></i></div>

      <h1>Pokédex do <span>Canal do Camaleão</span></h1>

  </header>

  <nav class="topo" id="topo">
    <a href="?p=inicio" data-p="inicio">🏠 Início</a>

</div>

<script src="pokedex.js"></script>
<script src="fitas-catalogo.js"></script>
<script src="perfil-dados.js"></script>
<script>
(function () {
  const GIST = "6401c2fb4d2043a0cc9e68cbadf2e639";
  // Login da Twitch para escrever no chat direto do site (app criado em dev.twitch.tv). Vazio = usa a barra da Twitch.
  const TWITCH_CLIENT_ID = "qfe3wqgnadh2rwi3ve7vkun6woub75";
  const TW = "pokedex_twitch";
  (function voltaDoLogin() {   // a Twitch devolve o acesso no fim do endereço (#access_token=...)
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("access_token")) {
      try { localStorage.setItem(TW, JSON.stringify({ token: h.get("access_token") })); sessionStorage.setItem("pokedex_abrir_chat", "1"); } catch (e) {}
      history.replaceState(null, "", location.pathname + location.search);
      // o login começou no chat desprendido (janela separada): volta para ele
      try { const v = JSON.parse(localStorage.getItem("pokedex_volta_chat") || "null"); localStorage.removeItem("pokedex_volta_chat");
        if (v && Date.now() - v.t < 10 * 60e3) { sessionStorage.removeItem("pokedex_abrir_chat"); location.replace(v.url); } } catch (e) {}
    }
  })();
  const TOTAL = 807;
  const LEND = new Set([144,145,146,150,151,243,244,245,249,250,251,377,378,379,380,381,382,383,384,385,386,480,481,482,483,484,485,486,487,488,489,490,491,492,493,494,638,639,640,641,642,643,644,645,646,647,648,649,716,717,718,719,720,721,772,773,785,786,787,788,789,790,791,792,793,794,795,796,797,798,799,800,801,802,803,804,805,806,807]);
  const BOLAS = {}; (window.USUM_BOLAS_LOJA || []).forEach((b) => { if (b.id !== "poke") BOLAS[b.id] = b.nome; });
  const SPR = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";
  // formas regionais: a caixa é de Alola (quem tem forma de Alola é a de Alola); o parceiro guarda a forma (Galar, Hisui...)
  const HOME_FORMA = { "0001": { 19: 10091, 20: 10092, 26: 10100, 27: 10101, 28: 10102, 37: 10103, 38: 10104, 50: 10105, 51: 10106, 52: 10107, 53: 10108, 74: 10109, 75: 10110, 76: 10111, 88: 10112, 89: 10113, 103: 10114, 105: 10115,
      77: 10162, 78: 10163, 79: 10164, 80: 10165, 83: 10166, 110: 10167, 122: 10168, 144: 10169, 145: 10170, 146: 10171, 199: 10172, 222: 10173, 263: 10174, 264: 10175, 554: 10176, 562: 10179, 618: 10180,
      58: 10229, 59: 10230, 100: 10231, 101: 10232, 157: 10233, 211: 10234, 215: 10235, 503: 10236, 549: 10237, 570: 10238, 571: 10239, 628: 10240, 705: 10241, 706: 10242, 713: 10243, 724: 10244, 128: 10250 },
    "0002": { 52: 10161, 555: 10177, 194: 10253 } };
  const ALOLA_CAIXA = new Set([19, 20, 26, 27, 28, 37, 38, 50, 51, 52, 53, 74, 75, 76, 88, 89, 103, 105]);
  const home = (n, s, forma) => {
    const f = forma === undefined ? (ALOLA_CAIXA.has(n) ? "0001" : "") : forma;
    const id = (f && HOME_FORMA[f] && HOME_FORMA[f][n]) || n;
    return SPR + "other/home/" + (s ? "shiny/" : "") + id + ".png";
  };
  const mini = (n) => SPR + n + ".png";
  const nome = (n) => (window.USUM_DEX || [])[n - 1] || "#" + n;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const nivel = (n) => "♥".repeat(n) + "♡".repeat(5 - n);
  const app = document.getElementById("app");
  const JOGO = (id) => (window.USUM_JOGOS || []).find((j) => j.id === id) || null;
  const TREIN = (id) => (window.USUM_TREINADORES || []).find((t) => t.id === id) || null;
  const capa = (j, cls) => !j ? "" : j.capa ? `<img class="${cls || "capa"}" src="assets/jogos/${j.id}.jpg" alt="Pokémon ${esc(j.nome)}">`
    : (cls ? "🎮" : `<div class="capa-txt">Pokémon<br>${esc(j.nome)}</div>`);
  const GEN = { m: ["♂", "Menino"], f: ["♀", "Menina"], nb: ["NB", "Não-binário"] };
  function slots(t) {
    return `<div class="time6">${[0, 1, 2, 3, 4, 5].map((i) => { const x = (t || [])[i];
      return x ? `<div class="slot ${x[1] ? "shiny" : ""}"><img src="${home(x[0], x[1])}" alt="" loading="lazy"><b>${esc(x[2] || nome(x[0]))}</b>${x[2] ? `<small class="sub">${esc(nome(x[0]))}</small>` : ""}</div>`
               : `<div class="slot vago"><span></span></div>`; }).join("")}</div>`;
  }
  let D = null, aba = "dex", filtro = "cap", busca = "";

  async function carregar() {
    try {
      const r = await fetch("https://api.github.com/gists/" + GIST, { cache: "no-store" });
      const g = await r.json();
      const f = g.files && g.files["dados.json"];
      let txt = f && f.content;
      if (f && f.truncated) txt = await (await fetch(f.raw_url)).text();
      D = JSON.parse(txt || "{}");
    } catch (e) { D = null; }
    window.__pokedexDados = D;
    if (!D || !D.t) { app.innerHTML = `<p class="vazio">Ainda não tem dados publicados. Volte depois da próxima live!</p>`; return; }
    document.getElementById("nomes").innerHTML = Object.values(D.t).map((u) => `<option value="${esc(u.n)}">`).join("");
    chatAoVivo();
    document.getElementById("rodape").textContent = D.em ? "Atualizado " + quando(D.em) + " · os dados sobem sozinhos durante a live"
      : "Os dados aparecem aqui a partir da próxima live";
    rota();
  }
  function quando(iso) {
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 2) return "agora há pouco"; if (m < 60) return "há " + m + " min";
    const h = Math.round(m / 60); if (h < 24) return "há " + h + " h";
    return "em " + new Date(iso).toLocaleDateString("pt-BR");
  }
  function achar(q) {
    q = (q || "").trim().toLowerCase().replace(/^@/, "");
    if (!q) return null;
    if (D.t[q]) return q;
    return Object.keys(D.t).find((k) => (D.t[k].n || "").toLowerCase() === q) || null;
  }
  function stats(u) {
    const c = u.c || {}, ks = Object.keys(c);
    return { esp: ks.length, total: ks.reduce((a, k) => a + c[k][0], 0), shiny: ks.filter((k) => c[k][1]).length,
      lend: ks.filter((k) => LEND.has(+k)).length, fitas: (u.f || []).length, amigos: (u.am || []).filter((a) => a[1] >= 5).length };
  }

  /* ---------- Reputação ---------- */
  const NIVEIS_REP = [
    { min: -1e9, nome: "Encrenqueiro", item: "black-sludge", cor: "#ff5f6d" },
    { min: -50, nome: "Desconfiado", item: "smoke-ball", cor: "#ff9a6b" },
    { min: 0, nome: "Neutro", item: "everstone", cor: "#cfd3dc" },
    { min: 50, nome: "Conhecido", item: "moon-stone", cor: "#9fb8c9" },
    { min: 150, nome: "Confiável", item: "thunder-stone", cor: "#ffd34d" },
    { min: 300, nome: "Respeitado", item: "dawn-stone", cor: "#4fe3d0" },
    { min: 500, nome: "Admirado", item: "shiny-stone", cor: "#fff27a" },
    { min: 750, nome: "Lenda do Chat", item: "comet-shard", cor: "#7fb8ff" },
    { min: 1000, nome: "Campeão", item: "rainbow-wing", cor: "#ff7ad9" }
  ];
  const DIA = 864e5;
  function reputacao(u) {
    const s = stats(u), am = u.am || [], agora = Date.now();
    const partes = [
      ["💬 Conversa no chat", Math.min(150, Math.round(6 * Math.sqrt(u.ms || 0))), (u.ms || 0) + ((u.ms || 0) === 1 ? " mensagem" : " mensagens"), 150],
      ["🌿 Capturas", Math.min(150, Math.round(10 * Math.sqrt(s.total))), s.total + (s.total === 1 ? " captura" : " capturas"), 150],
      ["🔁 Trocas", Math.min(120, Math.round(20 * Math.sqrt(u.tr || 0))), (u.tr || 0) + ((u.tr || 0) === 1 ? " troca" : " trocas"), 120],
      ["🎀 Fitas", Math.min(150, 5 * s.fitas), s.fitas + (s.fitas === 1 ? " fita" : " fitas"), 150],
      ["♥ Amizades", Math.min(300, am.reduce((t, a) => t + a[1] * 8, 0) + 20 * am.filter((a) => a[1] >= 5).length), am.length + (am.length === 1 ? " amizade, " : " amizades, ") + s.amigos + (s.amigos === 1 ? " melhor amigo" : " melhores amigos"), 300],
      ["✦ Shinies", Math.min(300, 30 * s.shiny), s.shiny + (s.shiny === 1 ? " shiny" : " shinies"), 300]
    ];
    const positivo = partes.reduce((t, p) => t + p[1], 0);
    const menos = [];
    // sumiu do chat: perde aos poucos (começa depois de 10 dias, no máximo 35%)
    if (u.ul) {
      const dias = Math.floor((agora - u.ul) / DIA);
      if (dias > 10) { const v = Math.round(positivo * Math.min(0.35, (dias - 10) * 0.01)); if (v) menos.push(["😴 Sumido há " + dias + " dias", v]); }
    }
    // timeout e ban: pesam menos com o tempo (metade a cada 30 dias)
    let to = 0, bn = 0, pen = 0;
    (u.pu || []).forEach(([ts, ban, dur]) => {
      const peso = Math.pow(0.5, (agora - ts) / (30 * DIA));
      if (ban) { bn++; pen += 250 * peso; } else { to++; pen += (30 + Math.min(60, (dur || 0) / 60)) * peso; }
    });
    if (pen >= 1) menos.push(["⛔ " + [to && to + (to > 1 ? " timeouts" : " timeout"), bn && bn + (bn > 1 ? " bans" : " ban")].filter(Boolean).join(" e "), Math.round(pen)]);
    const pts = positivo - menos.reduce((t, m) => t + m[1], 0);
    let i = 0; NIVEIS_REP.forEach((n, k) => { if (pts >= n.min) i = k; });
    return { pts, nivel: NIVEIS_REP[i], prox: NIVEIS_REP[i + 1] || null, partes, menos };
  }
  const iconeRep = (n, cls) => `<span class="rep-ico ${cls || ""}" style="--c:${n.cor}"><img src="assets/rep/${n.item}.png" alt="" title="${esc(n.nome)}"></span>`;
  function repHtml(u) {
    const r = reputacao(u), n = r.nivel;
    const ini = Math.max(n.min, -100), fim = r.prox ? r.prox.min : n.min + 1;
    const pct = r.prox ? Math.max(3, Math.min(100, ((r.pts - ini) / (fim - ini)) * 100)) : 100;
    return `<section class="reputacao" style="--c:${n.cor}">
      ${iconeRep(n, "grande")}
      <div class="rep-info">
        <div class="rep-topo"><span class="rep-rot">Reputação</span><b class="rep-nome">${esc(n.nome)}</b><span class="rep-pts">${r.pts} pts</span></div>
        <div class="rep-barra"><i style="width:${pct.toFixed(1)}%"></i></div>
        <small>${r.prox ? `faltam <b>${r.prox.min - r.pts}</b> pontos para <b>${esc(r.prox.nome)}</b>` : "reputação máxima! ✦"}</small>
        <details class="rep-det"><summary>Como está a sua reputação</summary>
          <div class="rep-linhas">${r.partes.map(([t, v, d, mx]) => `<div><span>${t}<small>${esc(d)}</small></span><b class="mais">+${v}<small>/${mx}</small></b></div>`).join("")}
          ${r.menos.map(([t, v]) => `<div><span>${esc(t)}</span><b class="menos">−${v}</b></div>`).join("")}</div>
          <p class="sub"><a href="?p=jogar#j-reputacao">Como funciona a reputação</a></p>
        </details>
      </div>
    </section>`;
  }

  const EU = "pokedex_eu";
  const lembrar = (l) => { try { localStorage.setItem(EU, l); } catch (e) {} };
  const lembrado = () => { try { return localStorage.getItem(EU) || ""; } catch (e) { return ""; } };
  function marcar(pag) {
    document.querySelectorAll("#topo a").forEach((a) => a.classList.toggle("on", a.dataset.p === pag));
    document.getElementById("busca").style.display = pag === "inicio" || pag === "perfil" ? "" : "none";
  }
  function ir(url) { history.pushState(null, "", url); rota(); window.scrollTo(0, 0); }
  document.getElementById("topo").onclick = (e) => {
    const a = e.target.closest("a"); if (!a || !D) return; e.preventDefault();
    if (a.dataset.p === "perfil") { const l = achar(lembrado()); return ir(l ? "?u=" + encodeURIComponent(l) : "?p=perfil"); }
    ir("?p=" + a.dataset.p);
  };
  window.addEventListener("popstate", () => D && rota());
  // dados novos da live a cada 2 minutos: redesenha a página (sem atrapalhar quem está com uma ficha aberta ou digitando)
  setInterval(async () => {
    if (!D || document.hidden || document.body.classList.contains("com-chat")) return;   // com o chat aberto, ele já atualiza
    try {
      const g = await (await fetch("https://api.github.com/gists/" + GIST, { cache: "no-store" })).json();
      const f = g.files && g.files["dados.json"]; let txt = f && f.content;
      if (f && f.truncated) txt = await (await fetch(f.raw_url)).text();
      const n = JSON.parse(txt || "{}");
      if (!n.t || n.em === D.em) return;
      D = n; window.__pokedexDados = n;
      const ocupado = document.querySelector(".ficha-fundo") || (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName));
      const rodape = document.getElementById("rodape"); if (rodape) rodape.textContent = "Atualizado " + quando(D.em) + " · os dados sobem sozinhos durante a live";
      if (!ocupado) { const y = scrollY; rota(); scrollTo(0, y); }
    } catch (e) {}
  }, 2 * 60e3);

  function rota() {
    const p = new URLSearchParams(location.search);
    const u = p.get("u") || location.hash.slice(1);
    const pag = p.get("p") || (u ? "perfil" : "inicio");
    if (["dex", "fitas", "amigos", "mochila"].includes(p.get("aba"))) aba = p.get("aba");
    const login = achar(u);
    if (u) document.getElementById("q").value = (login && D.t[login].n) || u;
    if (login) lembrar(login);
    if (pag === "fitas" || (!login && p.get("aba") === "fitas")) { marcar("fitas"); return paginaFitas(login); }
    if (pag === "jogar") { marcar("jogar"); return paginaJogar(); }
    if (pag === "fotos") { marcar("fotos"); return paginaFotos(); }

  function timeHtml(u) {

  function timePessoal(u) {
    const tms = u.tms || (u.tm ? { live: u.tm } : {}), jg = u.jg && JOGO(u.jg);
    const atual = jg ? tms[jg.id] : tms.live;

    let h = `<h2>${titulo}</h2><div class="${jg ? "jogo-atual" : ""}">${jg ? capa(jg) : ""}<div>${(atual || []).length ? slots(atual)

    const outros = Object.keys(tms).filter((k) => k !== (jg ? jg.id : "live") && (tms[k] || []).length);
    if (outros.length) h += `<div class="outros">` + outros.map((k) => { const j = JOGO(k);
      return `<div class="item">${j ? capa(j, "mini-capa") : "📺"} <span style="min-width:150px">${j ? "Pokémon " + esc(j.nome) : "Time da live"}</span>${tms[k].map((x) => `<img class="s" src="${home(x[0], x[1])}" alt="">`).join("")}</div>`; }).join("") + `</div>`;

        <div class="item"><img src="assets/bolas/poke-ball.png" alt=""><span><b>Poké Ball</b> · infinitas (padrão)</span></div>` +
        it.map((k) => `<div class="item"><img src="assets/bolas/${k}-ball.png" alt=""><span><b>${BOLAS[k]}</b> · ${b[k]}×${u.eq === k ? " · <b>equipada</b>" : ""}<br><small class="sub">${esc(ef(k))}</small></span></div>`).join("") +
        `</div><p class="sub" style="margin-top:12px">Compre bolas com pontos do canal e equipe no chat com <b>!ball nome</b>. Veja todas e como conseguir em <a href="?p=bolas">Pokébolas</a>.</p>`;
    }
  }

  function grade(u) {
    const c = u.c || {}, q = busca.trim().toLowerCase();
    let nums = filtro === "todos" ? Array.from({ length: TOTAL }, (_, i) => i + 1) : Object.keys(c).map(Number).sort((a, b) => a - b);
    if (filtro === "shiny") nums = nums.filter((n) => c[n] && c[n][1]);
    if (q) nums = nums.filter((n) => nome(n).toLowerCase().includes(q) || String(n) === q);
    const g = document.getElementById("grade");
    if (!nums.length) { g.innerHTML = `<p class="vazio">${filtro === "cap" && !q ? "Nenhum Pokémon capturado ainda. Fique de olho na grama durante a live e digite !capturar!" : "Nada por aqui."}</p>`; return; }
    g.innerHTML = nums.map((n) => {
      const e = c[n], tem = !!e, sh = tem && e[1] > 0;
      const img = tem ? home(n, sh) : mini(n);
      const melhor = tem ? Math.max(0, ...individuos(e).map((x) => x.f)) : 0;
      return `<div class="pk ${tem ? "tem" : "falta"} ${sh ? "shiny" : ""} ${LEND.has(n) && tem ? "lend" : ""}" data-n="${n}">
        ${tem && e[0] > 1 ? `<span class="q">×${e[0]}</span>` : ""}
        <img src="${img}" alt="" loading="lazy"><div class="n">#${String(n).padStart(3, "0")}</div><b>${esc(nome(n))}</b>
        ${tem && (e[2] || []).length ? `<span class="fz ${classeForca(melhor)}">${melhor === 100 ? "✦ " : ""}${melhor}%</span>` : ""}</div>`;
    }).join("");
    g.querySelectorAll(".pk.tem").forEach((el) => (el.onclick = () => fichaPokemon(u, +el.dataset.n)));
  }

  /* ---------- status dos Pokémon (força) ---------- */
  const ROT_IV = ["HP", "Ataque", "Defesa", "Atq. Esp.", "Def. Esp.", "Velocidade"];
  const forcaDe = (iv) => Math.round((iv.reduce((a, b) => a + b, 0) / 186) * 100);
  const notaDe = (f) => (f >= 100 ? "Perfeito ✦" : f >= 90 ? "Incrível" : f >= 75 ? "Ótimo" : f >= 50 ? "Bom" : f >= 25 ? "Razoável" : "Fraco");
  const classeForca = (f) => (f >= 100 ? "f-perf" : f >= 90 ? "f-inc" : f >= 75 ? "f-oti" : f >= 50 ? "f-bom" : f >= 25 ? "f-raz" : "f-fra");
  const NATUREZAS = ["Hardy", "Lonely", "Brave", "Adamant", "Naughty", "Bold", "Docile", "Relaxed", "Impish", "Lax", "Timid", "Hasty",
    "Serious", "Jolly", "Naive", "Modest", "Mild", "Quiet", "Bashful", "Rash", "Calm", "Gentle", "Sassy", "Careful", "Quirky"];
  function individuos(e) {   // [qtd, shiny, [[ivs, shiny, data]]] → lista em ordem (1 = mais forte), igual ao chat
    return (e[2] || []).map(([cod, sh, t, a, n]) => { const iv = String(cod).split("").map((x) => parseInt(x, 32)); return { iv, s: !!sh, t: t * 1000, f: forcaDe(iv), a: a || "", n: n != null ? NATUREZAS[n] : "" }; })
      .sort((a, b) => b.f - a.f || a.t - b.t);
  }
  function fichaPokemon(u, n) {
    const e = (u.c || {})[n]; if (!e) return;
    const lista = individuos(e), login = Object.keys(D.t).find((k) => D.t[k] === u) || "";
    const fundo = document.createElement("div"); fundo.className = "ficha-fundo";
    fundo.innerHTML = `<div class="ficha">
      <button class="fechar-ficha" title="Fechar">✕</button>
      <div class="ficha-topo"><img src="${home(n, e[1] > 0)}" alt=""><div><small>#${String(n).padStart(3, "0")}</small><h3>${esc(nome(n))}</h3>
        <span>${e[0]} ${e[0] === 1 ? "capturado" : "capturados"}${e[1] ? ` · ${e[1]} shiny ✦` : ""}</span></div></div>
      ${lista.length ? lista.map((x, i) => `<div class="ind ${classeForca(x.f)}">
        <div class="ind-cab"><b>#${i + 1}</b>${x.a ? `<span class="apelido">“${esc(x.a)}”</span>` : ""}${x.s ? '<span class="sh">✦ shiny</span>' : ""}<span class="nota">${x.n || notaDe(x.f)}</span><span class="pct">${x.f}%</span></div>
        <div class="ivs">${x.iv.map((v, k) => `<div><span>${ROT_IV[k]}</span><div class="iv-barra"><i style="width:${(v / 31) * 100}%" class="${v === 31 ? "max" : ""}"></i></div><em>${v}</em></div>`).join("")}</div>
        ${x.t ? `<small class="quando">capturado em ${new Date(x.t).toLocaleDateString("pt-BR")}</small>` : ""}
      </div>`).join("") : `<p class="sub">Os status aparecem depois da próxima atualização da live.</p>`}
      <p class="sub ficha-dica">Cada Pokémon tem 6 status de 0 a 31; a <b>força</b> é a soma deles (100% = perfeito). Para soltar um: <code>!release ${esc(nome(n).toLowerCase())} 2</code> (o número da lista) ou só <code>!release ${esc(nome(n).toLowerCase())}</code> para soltar o mais fraco. Na troca: <code>!trade @pessoa ${esc(nome(n).toLowerCase())} 1 por ...</code> Para dar um nome: <code>!apelido ${esc(nome(n).toLowerCase())} 1 Nome</code> (até 12 letras).</p>
    </div>`;
    const fechar = () => fundo.remove();
    fundo.onclick = (ev) => { if (ev.target === fundo) fechar(); };
    fundo.querySelector(".fechar-ficha").onclick = fechar;
    document.addEventListener("keydown", function esc1(ev) { if (ev.key === "Escape") { fechar(); document.removeEventListener("keydown", esc1); } });
    document.body.appendChild(fundo);
  }

  function chatAoVivo() {
    const canal = (D && D.canal || "canaldocamaleao").toLowerCase();
    if (!canal || canal === "seucanal") return;
    const b = document.createElement("button"); b.className = "chat-btn"; b.textContent = "💬 Chat da live";
    const p = document.createElement("aside"); p.className = "chat-painel modo-overlay";
    p.innerHTML = `<header><div class="chat-abas"><button data-a="overlay" class="on">✨ Chat da live</button><button data-a="twitch">Twitch</button></div><div class="chat-acoes"><button class="soltar" title="Abrir o chat numa janela separada (no celular, em tela cheia)">⧉ Desprender</button><button class="fechar">Fechar</button></div></header>
      <iframe class="f-overlay" title="Chat da live"></iframe>
      <div class="barra-twitch"><button class="crescer" title="Abrir mais (emotes)">▲</button><iframe class="f-twitch" title="Escrever no chat"></iframe></div>`;
    let carregado = false, timer = null;
    const mostrar = (a) => {
      p.classList.toggle("modo-overlay", a === "overlay"); p.classList.toggle("modo-twitch", a === "twitch");
      p.querySelectorAll(".chat-abas button").forEach((x) => x.classList.toggle("on", x.dataset.a === a));
    };
    // enquanto o chat está aberto, puxa os dados novos da live de vez em quando (parceiros, equipes, fitas)
    const atualizar = async () => {
      try {
        const g = await (await fetch("https://api.github.com/gists/" + GIST, { cache: "no-store" })).json();
        const f = g.files && g.files["dados.json"]; let txt = f && f.content;
        if (f && f.truncated) txt = await (await fetch(f.raw_url)).text();
        const n = JSON.parse(txt || "{}"); if (n && n.t) { D = n; window.__pokedexDados = n; }
      } catch (e) {}
    };
    const abrir = (on) => {
      if (on && !carregado) {
        carregado = true;
        p.querySelector(".f-overlay").src = `chat.html?canal=${encodeURIComponent(canal)}&g=${encodeURIComponent(GIST)}${TWITCH_CLIENT_ID ? "&cid=" + TWITCH_CLIENT_ID : ""}`;
        p.querySelector(".f-twitch").src = `https://www.twitch.tv/embed/${encodeURIComponent(canal)}/chat?parent=${location.hostname}&darkpopout`;
      }
      p.classList.toggle("on", on); document.body.classList.toggle("com-chat", on); b.style.display = on ? "none" : "";
      clearInterval(timer); if (on) timer = setInterval(atualizar, 75000);   // chat aberto: dados (e avisos) novos a cada 75 s
    };
    b.onclick = () => abrir(true); p.querySelector(".fechar").onclick = () => abrir(false);
    // desprender: abre o chat numa janelinha própria, para deixar a live numa tela e o chat em outra (ou do lado)
    p.querySelector(".soltar").onclick = () => {
      const url = `chat.html?canal=${encodeURIComponent(canal)}&g=${encodeURIComponent(GIST)}${TWITCH_CLIENT_ID ? "&cid=" + TWITCH_CLIENT_ID : ""}&janela=1`;
      // no celular: abre o chat na aba inteira (com botão de tela cheia); no computador: janelinha separada
      const celular = matchMedia("(pointer: coarse)").matches || innerWidth < 820;
      if (celular) { location.href = url; return; }
      const w = window.open(url, "chat_canaldocamaleao", "popup=yes,width=460,height=860");
      if (w) { w.focus(); abrir(false); } else location.href = url;   // se o navegador bloquear a janela, abre na mesma aba
    };
    if (TWITCH_CLIENT_ID) p.classList.add("com-login");   // a caixa de escrever fica dentro do próprio chat do overlay
    try { if (sessionStorage.getItem("pokedex_abrir_chat")) { sessionStorage.removeItem("pokedex_abrir_chat"); setTimeout(() => abrir(true), 300); } } catch (e) {}
    p.querySelectorAll(".chat-abas button").forEach((x) => (x.onclick = () => mostrar(x.dataset.a)));
    // ao clicar na barra da Twitch, ela cresce: assim aparecem as janelinhas dela (regras do chat, login, emotes)
    // e a pessoa digita vendo o chat do overlay em cima. Volta ao normal quando clica fora.
    const ft = p.querySelector(".f-twitch");
    setInterval(() => {
      const foco = document.activeElement === ft;
      if (foco !== p.classList.contains("digitando")) p.classList.toggle("digitando", foco);
    }, 250);
    const cr = p.querySelector(".crescer");
    cr.onclick = () => { const g = p.classList.toggle("barra-grande"); cr.textContent = g ? "▼" : "▲"; cr.title = g ? "Diminuir" : "Abrir mais (emotes)"; };
    document.body.append(b, p);
  }

  // Caixa de escrever nossa: entra com a Twitch e manda a mensagem pelo chat da Twitch (aparece no chat do overlay em cima)
  function escreverComLogin(p, canal) {
    p.classList.add("com-login");
    const box = document.createElement("form"); box.className = "escrever";
    p.querySelector(".f-overlay").after(box);
    let ws = null, eu = null, fila = [];
    const lerTok = () => { try { return (JSON.parse(localStorage.getItem(TW)) || {}).token || ""; } catch (e) { return ""; } };
    const sair = () => { try { localStorage.removeItem(TW); } catch (e) {} eu = null; if (ws) ws.close(); ws = null; desenhar(); };
    const entrar = () => {
      const u = new URL("https://id.twitch.tv/oauth2/authorize");
      u.search = new URLSearchParams({ response_type: "token", client_id: TWITCH_CLIENT_ID, redirect_uri: location.origin + location.pathname,
        scope: "chat:read chat:edit", state: Math.random().toString(36).slice(2) }).toString();
      location.href = u.toString();
    };
    const aviso = (t) => { const a = box.querySelector(".aviso-tw"); if (a) { a.textContent = t; a.hidden = !t; } };
    function conectar() {
      if (ws || !eu) return;
      ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
      ws.onopen = () => { ws.send("PASS oauth:" + lerTok()); ws.send("NICK " + eu); ws.send("JOIN #" + canal); };
      ws.onmessage = (ev) => ev.data.split("\r\n").forEach((l) => {
        if (l.startsWith("PING")) ws.send("PONG :tmi.twitch.tv");
        else if (/ 001 /.test(l)) { fila.forEach((t) => ws.send(`PRIVMSG #${canal} :${t}`)); fila = []; }
        else if (/ NOTICE /.test(l)) {
          const txt = l.split(" :").slice(-1)[0];
          if (/authentication failed|improperly formatted auth/i.test(txt)) { sair(); aviso("Sua entrada expirou. Entre de novo com a Twitch."); }
          else aviso(txt);
        }
      });
      ws.onclose = () => { ws = null; };
    }
    async function desenhar() {
      const tok = lerTok();
      if (tok && !eu) {
        try {
          const r = await fetch("https://id.twitch.tv/oauth2/validate", { headers: { Authorization: "OAuth " + tok } });
          if (r.ok) eu = (await r.json()).login; else { try { localStorage.removeItem(TW); } catch (e) {} }
        } catch (e) {}
      }
      if (!eu) {
        box.innerHTML = `<button type="button" class="entrar-tw">🔑 Entrar com a Twitch para escrever</button><small class="aviso-tw" hidden></small>`;
        box.querySelector(".entrar-tw").onclick = entrar; return;
      }
      box.innerHTML = `<div class="linha-tw"><input maxlength="500" placeholder="Mandar no chat como ${esc(eu)}…" autocomplete="off"><button>Enviar</button></div>
        <small class="quem-tw">conectado como <b>${esc(eu)}</b> · <a href="#" class="sair-tw">sair</a></small><small class="aviso-tw" hidden></small>`;
      box.querySelector(".sair-tw").onclick = (e) => { e.preventDefault(); sair(); };
      conectar();
    }
    box.onsubmit = (e) => {
      e.preventDefault();
      const i = box.querySelector("input"); if (!i) return;
      const t = i.value.replace(/[\r\n]+/g, " ").trim(); if (!t) return;
      aviso("");
      if (ws && ws.readyState === 1) ws.send(`PRIVMSG #${canal} :${t}`); else { fila.push(t); conectar(); }
      i.value = "";
    };
    desenhar();
  }

  document.getElementById("busca").onsubmit = (e) => {
    e.preventDefault(); if (!D) return;
    const v = document.getElementById("q").value, l = achar(v);
    if (l) { aba = "dex"; ir("?u=" + encodeURIComponent(l)); } else { marcar("inicio"); inicio(v); }
  };
  carregar();
})();
</script>
</body>
