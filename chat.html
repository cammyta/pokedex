<title>Chat da live</title>
<link rel="stylesheet" href="overlay/style.css">
<style>
  html, body { margin: 0; width: 100% !important; height: 100%; height: 100dvh; overflow: hidden; background: #140c24; }
  /* chat desprendido: barrinha em cima com "tela cheia" e "voltar ao site" */
  .barra-janela { display: none; }
  body.janela .barra-janela { display: flex; position: fixed; left: 0; right: 0; top: 0; z-index: 30; height: 40px; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 10px; padding-top: env(safe-area-inset-top); background: #1d1233; box-shadow: 0 2px 10px rgba(0,0,0,.35); font: 600 13px "Fredoka", "Poppins", sans-serif; color: #fff; }
  body.janela .barra-janela button, body.janela .barra-janela a { border: 0; border-radius: 10px; padding: 6px 12px; background: rgba(255,255,255,.12); color: #fff;
    font: inherit; text-decoration: none; cursor: pointer; }
  body.janela #chat { top: calc(48px + env(safe-area-inset-top)); bottom: calc(10px + env(safe-area-inset-bottom)); }
  body.janela.cheia .barra-janela .tela-cheia { display: none; }
  @media (pointer: fine) { body.janela .barra-janela .voltar { display: none; } }
  body.solo { width: 100%; height: 100%; }
  #chat { left: 10px; top: 10px; right: 10px; bottom: 10px; }

  @media (max-width: 420px) { body { zoom: .85; } }
  /* caixa de escrever dentro do próprio overlay */
  .compor { flex: none; margin: 8px 12px 12px; position: relative; z-index: 2; }
  .compor .entrar { width: 100%; border: 0; cursor: pointer; padding: 12px; border-radius: 18px; font: 600 15px "Fredoka", "Poppins", sans-serif; color: #fff;
    background: linear-gradient(90deg, rgba(255,170,60,.85), rgba(150,110,255,.85)); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .compor .caixa { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 8px; border-radius: 20px;
    background: rgba(20,12,40,.72); backdrop-filter: blur(8px); box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.12); }
  .compor .caixa:focus-within { box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,200,120,.55), 0 0 18px rgba(255,190,120,.25); }
  .compor .mini-av { width: 52px; height: 52px; flex: none; border-radius: 16px; display: grid; place-items: center; overflow: hidden; background: rgba(255,255,255,.08); }
  .compor .mini-av img { width: 50px; height: 50px; object-fit: contain; image-rendering: pixelated; border-radius: 14px; }
  .compor .mini-av img.ovo { width: 34px; height: 34px; }
  .compor .meio { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .compor .rot { font: 500 11.5px "Poppins", sans-serif; color: rgba(255,255,255,.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compor .rot b { color: #ffd88a; font-weight: 600; }
  .compor input { width: 100%; border: 0; outline: none; background: transparent; color: #fff; font: 500 15px "Poppins", sans-serif; padding: 2px 0; }
  .compor input::placeholder { color: rgba(255,255,255,.45); }
  .compor .enviar { flex: none; width: 42px; height: 42px; border: 0; border-radius: 14px; cursor: pointer; color: #fff; font-size: 18px;
    background: linear-gradient(135deg, #ffb347, #b07cff); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .compor .enviar:active { transform: scale(.94); }
  .compor .pe { display: flex; justify-content: space-between; margin: 5px 6px 0; font: 11px "Poppins", sans-serif; color: rgba(255,255,255,.5); }
  .compor .pe a { color: rgba(255,255,255,.6); }
  .compor .erro { color: #ffb3b3; }
  .compor .rapidos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 6px; }
  .compor .rapidos button { padding: 6px 4px !important; font-size: 12.5px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compor .acao2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 8px; }
  .compor .acao2 button { border: 0; cursor: pointer; height: 46px; border-radius: 14px; font: 700 16px "Fredoka", "Poppins", sans-serif; color: #fff; letter-spacing: .3px;
    box-shadow: 0 4px 12px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.2); }
  .compor .acao2 .cap-b { background: linear-gradient(180deg, #ff5a5f, #d92b3a); }

  .compor .acao2 button:active { transform: translateY(1px); }

  .compor .acao2 button.ok { animation: ok-b .4s ease-out; }
  .compor .rapidos .tr-b.tem::after { content: "1"; display: inline-grid; place-items: center; margin-left: 4px; width: 16px; height: 16px; border-radius: 50%; background: #ff3b6b; font-size: 10px; }
  .compor .rapidos button { flex: none; border: 0; cursor: pointer; padding: 7px 12px; border-radius: 999px; font: 600 13px "Fredoka", "Poppins", sans-serif; color: #fff;
    background: rgba(20,12,40,.75); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); }
  .compor .rapidos button.raid-b { background: linear-gradient(90deg, #ff3b6b, #ff8a3d); }
  .compor .rapidos button:disabled { opacity: .5; cursor: wait; }
  .compor .rapidos button.ok { animation: ok-b .4s ease-out; }

  .compor .painel { margin: 0 0 8px; padding: 10px; border-radius: 16px; background: rgba(14,8,30,.92); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.14); font: 13px "Fredoka", "Poppins", sans-serif; color: #fff; max-height: 46vh; overflow: auto; }
  .compor .painel[hidden] { display: none; }
  .compor .painel h4 { margin: 0 0 8px; font: 600 14px "Fredoka", sans-serif; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .compor .painel h4 small { font-weight: 400; color: rgba(255,255,255,.6); }
  .compor .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
  .compor .slot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border: 0; border-radius: 12px; cursor: pointer; color: #fff; font: 600 11px "Fredoka", sans-serif;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.1); }
  .compor .slot img { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; }
  .compor .slot.bola img { width: 30px; height: 30px; object-fit: contain; border-radius: 0; }
  .compor .slot.atual { box-shadow: inset 0 0 0 2px #ffd86b; background: rgba(255,216,107,.14); }
  .compor .slot.sel { box-shadow: inset 0 0 0 2px #8fd36a; background: rgba(143,211,106,.16); }

  .compor .slot .num { position: absolute; top: 3px; left: 5px; font-size: 10px; color: #8fd36a; }
  .compor .painel .acoes { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .compor .painel .acoes button { border: 0; cursor: pointer; padding: 6px 12px; border-radius: 999px; font: 600 12px "Fredoka", sans-serif; color: #fff; background: rgba(255,255,255,.12); }
  .compor .painel .acoes button.prim { background: linear-gradient(90deg, #ffb347, #b07cff); }
  .compor .grade.seis { grid-template-columns: repeat(3, 1fr); }
  .compor .slot .vira { all: unset; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; width: 100%; }
  .compor .slot .lapis { position: absolute; top: 3px; right: 3px; border: 0; cursor: pointer; width: 24px; height: 24px; border-radius: 8px; font-size: 12px; background: rgba(0,0,0,.45); }
  .compor .slot.vazio-ed { border: 1.5px dashed rgba(255,255,255,.3); background: transparent; min-height: 74px; justify-content: center; color: rgba(255,255,255,.6); }
  .compor .slot .mais { font-size: 22px; line-height: 1; }
  .compor .topo-ed { position: sticky; top: -10px; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: -10px -10px 8px; padding: 10px; background: rgba(14,8,30,.98); }
  .compor .topo-ed button { border: 0; cursor: pointer; padding: 6px 12px; border-radius: 999px; font: 600 12px "Fredoka", sans-serif; color: #fff; background: rgba(255,255,255,.14); margin-left: 4px; }
  .compor .nao-achou { margin-top: 8px; } .compor .nao-achou button { border: 0; cursor: pointer; padding: 6px 12px; border-radius: 999px; font: 600 12px "Fredoka", sans-serif; color: #fff; background: linear-gradient(90deg, #ffb347, #b07cff); }
  .compor .nao-achou small { color: rgba(255,255,255,.6); }
  .compor .grade.mini { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); max-height: 190px; overflow: auto; }
  .compor .grade.mini .slot img { width: 36px; height: 36px; }
  .compor .tr-gente { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .compor .tr-gente button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 0; cursor: pointer; padding: 8px 10px; border-radius: 12px; color: #fff; text-align: left;
    background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.1); font: 600 13px "Fredoka", sans-serif; }
  .compor .tr-gente small { font-weight: 400; color: rgba(255,255,255,.55); font-size: 11px; }
  .compor .tr-jan { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 4px 0 10px; padding: 10px; border-radius: 14px;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 70%), rgba(40,80,160,.25); box-shadow: inset 0 0 0 1.5px rgba(140,190,255,.35); }
  .compor .tr-card { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
  .compor .tr-card img { width: 64px; height: 64px; object-fit: cover; border-radius: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .compor .tr-card b { font: 600 13px "Fredoka", sans-serif; } .compor .tr-card small { color: rgba(255,255,255,.6); font-size: 11px; }
  .compor .tr-vazio { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 14px; border: 1.5px dashed rgba(255,255,255,.3); font-size: 22px; color: rgba(255,255,255,.4); }
  .compor .tr-seta { font-size: 22px; color: #9fd0ff; }
  .compor .tr-acoes { display: flex; gap: 6px; margin: 0 0 8px; }
  .compor .tr-acoes button { flex: 1; border: 0; cursor: pointer; padding: 9px 12px; border-radius: 12px; font: 600 13px "Fredoka", sans-serif; color: #fff; background: rgba(255,255,255,.12); }
  .compor .tr-acoes button.prim { background: linear-gradient(90deg, #4fa3ff, #8a6bff); } .compor .tr-acoes button:disabled { opacity: .45; cursor: default; }
  .compor .tr-aviso { margin: 4px 0 6px; color: rgba(255,255,255,.7); font-size: 12px; }
  .compor .tr-ok { text-align: center; font: 600 15px "Fredoka", sans-serif; margin: 0 0 8px; opacity: 0; animation: tr-aparece .4s ease-out 1.7s forwards; } .compor .tr-ok small { display: block; font-weight: 400; font-size: 11px; color: rgba(255,255,255,.6); }
  /* animaçãozinha: os dois Pokémon entram na Pokébola, a bola gira no meio e eles saem trocados de lado */
  .compor .tr-jan.anim .tr-card:first-child { animation: tr-vai 1.8s ease-in-out forwards; }
  .compor .tr-jan.anim .tr-card:last-child { animation: tr-vem 1.8s ease-in-out forwards; }
  .compor .tr-bola { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle, #fff 0 22%, #222 23% 32%, transparent 33%), linear-gradient(#ff4b5c 0 46%, #222 46% 54%, #f4f4f4 54%);
    box-shadow: 0 0 0 2px #222, 0 0 14px rgba(255,255,255,.5); animation: tr-gira 1.8s ease-in-out forwards; }
  @keyframes tr-vai { 0% { transform: none; } 30% { transform: translateX(40%) scale(.2); opacity: .2; } 70% { transform: translateX(160%) scale(.2); opacity: .2; } 100% { transform: translateX(calc(100% + 54px)) scale(1); opacity: 1; } }
  @keyframes tr-vem { 0% { transform: none; } 30% { transform: translateX(-40%) scale(.2); opacity: .2; } 70% { transform: translateX(-160%) scale(.2); opacity: .2; } 100% { transform: translateX(calc(-100% - 54px)) scale(1); opacity: 1; } }
  @keyframes tr-gira { 0% { transform: scale(.6); } 35%, 65% { transform: scale(1.35) rotate(540deg); box-shadow: 0 0 0 2px #222, 0 0 26px #fff6a0; } 100% { transform: scale(1) rotate(720deg); } }
  @keyframes tr-aparece { to { opacity: 1; } }
  .compor .painel input.busca { position: sticky; top: 36px; z-index: 2; width: 100%; margin: 0 0 8px; padding: 6px 10px; border: 0; border-radius: 10px; background: rgba(255,255,255,.1); color: #fff; font: 13px "Poppins", sans-serif; }
  @keyframes ok-b { 40% { transform: scale(1.1); box-shadow: 0 0 0 3px rgba(143,211,106,.7); } }
</style>

<body class="solo">
  <div class="barra-janela"><a class="voltar" href="./">← Site</a><span>💬 Chat da live</span><button class="tela-cheia" type="button">⛶ Tela cheia</button></div>
  <div id="chat" class="moldura vidro"></div>
<script>
  // chat desprendido (?janela=1): no celular abre na aba inteira e dá para pôr em tela cheia
  (function () {
    if (!/[?&]janela=1/.test(location.search)) return;
    document.body.classList.add("janela");
    const b = document.querySelector(".tela-cheia"), raiz = document.documentElement;
    const pode = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
    if (!pode) b.style.display = "none";   // iPhone: sem tela cheia em site; dá para "Adicionar à Tela de Início"
    b.onclick = () => { try { (raiz.requestFullscreen || raiz.webkitRequestFullscreen).call(raiz, { navigationUI: "hide" }); } catch (e) {} };
    document.addEventListener("fullscreenchange", () => document.body.classList.toggle("cheia", !!document.fullscreenElement));
  })();
</script>
<script>
  // Configuração só do site: as imagens vêm direto da internet (não tem a pasta do PC aqui)
  window.USUM_CONFIG = {
    canal: "",
    chat: { maxMensagens: 30, mostrarParceiro: true },
    imagens: {
      pastaPMD: "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/",
      pmdOnline: "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/",
      pastaPropria: "assets/retratos/",
      pastaHOME: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/"
    }
  };
  // os dados vêm da página principal (mesmo site); aberto sozinho, busca no Gist
  const pai = (() => { try { return window.parent !== window ? window.parent : null; } catch (e) { return null; } })();
  const dadosPai = () => { try { return pai && pai.__pokedexDados; } catch (e) { return null; } };
  const q = new URLSearchParams(location.search);
  window.USUM_CONFIG.canal = q.get("canal") || ((dadosPai() || {}).canal) || "";
</script>
<script src="pokedex.js"></script>
<script src="fitas-catalogo.js"></script>
<script>
  // avisos do overlay (capturas, fitas, eventos...) chegam pelos dados publicados
  window.USUM = window.USUM || {};
  USUM.FITAS = window.FITAS || [];
  const __ouvintes = [];
  USUM.aoFitaEvento = (fn) => __ouvintes.push(fn);
  USUM.__avisar = (ev) => __ouvintes.forEach((fn) => { try { fn(ev); } catch (e) { console.error(e); } });
</script>
<script src="overlay/poke.js"></script>
<script src="overlay/twitch.js"></script>
<script src="overlay/chat.js"></script>
<script src="overlay/rancho.js"></script>
<script>
(function () {
  const INICIAIS = new Set([722, 725, 728, 25, 133, 35]);
  const ler = (k, p) => { try { return JSON.parse(localStorage.getItem(k)) || p; } catch (e) { return p; } };
  const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let D = null, ultimo = "";

  // copia o que a live publicou para o formato que o chat do overlay entende
  const abriu = Date.now(), jaVi = new Set();
  function semear(dados) {
    if (!dados || !dados.t || dados.em === ultimo) return;
    ultimo = dados.em; D = dados;
    // avisos recentes do overlay: mostra os que aconteceram desde pouco antes de abrir o chat
    (D.av || []).forEach((ev) => {
      if (!ev || jaVi.has(ev.k) || ev.t < abriu - 3 * 60e3) return;
      jaVi.add(ev.k); setTimeout(() => USUM.__avisar(ev), 50);
    });
    const parc = {}, times = {}, bolas = {}, bolhas = {};
    Object.entries(D.t).forEach(([l, u]) => {
      if (u.p && u.p[0]) parc[l] = { num: u.p[0], shiny: !!u.p[1], forma: u.p[2] && u.p[2] !== "k" ? u.p[2] : "", kanto: u.p[2] === "k" || undefined };
      if (u.t) times[l] = u.t;
      if (u.eq) bolas[l] = u.eq;
      if (u.bh) bolhas[l] = { tem: u.bh[0] || [], usa: u.bh[1] || "" };   // bolhas conquistadas (Rancho, Cinéfilo)
    });
    gravar("usum_bolhas", bolhas);
    if (USUM.__atualizarMel) USUM.__atualizarMel();
    // quem trocou de parceiro aqui há pouco: vale a escolha nova até os dados da live alcançarem (no máximo 20 min)
    const novos = ler("usum_parc_local", {}), agora = Date.now();
    Object.entries(novos).forEach(([l, x]) => {
      const pub = parc[l], igual = pub && pub.num === x.p.num && !!pub.shiny === !!x.p.shiny;
      if (igual || agora - x.t > 20 * 60e3) delete novos[l]; else parc[l] = x.p;
    });
    gravar("usum_parc_local", novos);
    gravar("usum_parceiros", parc); gravar("usum_times", times); gravar("usum_bolas", bolas);
    if (D.pl) gravar("usum_placar", D.pl);
    // quem comprou filme do cartaz (balão de ingresso): [nome, [logins], posição na lista]
    const cz = []; (D.cz || []).forEach(([nome, quem, pos]) => { cz[pos] = { nome, quem }; });
    gravar("usum_cartaz", { filmes: Array.from(cz, (f) => f || { nome: "", quem: [] }) });
  }
  const usuario = (l) => (D && D.t && D.t[l]) || {};
  USUM.urlFita = (id) => "assets/fitas/" + id + ".png";
  // igual ao overlay: a fita escolhida com !fita; se não escolheu, a mais recente que ganhou
  USUM.fitaDe = (l) => { const u = usuario(l), f = u.f || []; return (u.fe && f.includes(u.fe) ? u.fe : f[f.length - 1]) || ""; };
  USUM.nomeTreinador = (l) => usuario(l).n || l;
  USUM.amizade = (a, b) => { const x = (usuario(a).am || []).find((e) => e[0] === b); return { pontos: x ? 1 : 0, nivel: x ? x[1] : 0 }; };

  // Lê os dados publicados pela live. Usa o link "raw" do Gist (não tem limite de acessos);
  // a API do GitHub só entra se o raw falhar, porque ela deixa só 60 acessos por hora para cada internet.
  const DONO_GIST = "cammyta";
  async function baixarGist(id) {
    let dono = DONO_GIST; try { dono = localStorage.getItem("pokedex_gist_dono") || DONO_GIST; } catch (e) {}
    try {
      const r = await fetch(`https://gist.githubusercontent.com/${dono}/${id}/raw/dados.json?t=${Date.now()}`, { cache: "no-store" });
      if (r.ok) return JSON.parse(await r.text());
    } catch (e) {}
    try {
      const r = await fetch("https://api.github.com/gists/" + id, { cache: "no-store" }); if (!r.ok) return null;
      const g = await r.json(); if (g.owner && g.owner.login) try { localStorage.setItem("pokedex_gist_dono", g.owner.login); } catch (e) {}
      const f = g.files && g.files["dados.json"]; let txt = f && f.content;
      if (f && f.truncated) txt = await (await fetch(f.raw_url)).text();
      return JSON.parse(txt || "{}");
    } catch (e) { return null; }
  }
  async function buscarGist() {
    const g = q.get("g"); if (!g) return;
    // dentro do site, usa os dados que o site já baixou (não gasta acesso)
    try { if (pai && pai.__pokedexDados && pai.__pokedexDados.t) { semear(pai.__pokedexDados); return; } } catch (e) {}
    const d = await baixarGist(g); if (d && d.t) semear(d);
  }

  // comandos: só os que dão pra mostrar na hora sem estragar nada (o overlay da live é quem manda de verdade)
  function aoComando(m, cmd, txt, aviso) {
    if (/^!(trade|troca|trocar)$/.test(cmd) && USUM.__aoTrade) { try { USUM.__aoTrade(m, txt); } catch (e) {} }
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    if (cmd === "!sol" || cmd === "!lua") {
      const t = ler("usum_times", {}), time = cmd.slice(1);
      if (t[m.login] && t[m.login] !== time) return;   // trocar de equipe só na próxima live: quem manda é o overlay
      if (t[m.login] !== time) { t[m.login] = time; gravar("usum_times", t);
        aviso(time, `<b>${esc(m.nome)}</b> entrou para a Equipe ${time === "sol" ? "Sol" : "Lua"}!`); }
      return;

          el.querySelector(".tr-b").classList.add("tem"); abrirTroca();
        }
        if (troca && troca.com === m.login && troca.modo === "recebida" && /^(cancelar|cancela)$/.test(acao)) { troca = null; el.querySelector(".tr-b").classList.remove("tem"); if (painel.dataset.p === "trade") desenharTroca(); }
      };
      painel.addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        const u = eu_();
        const d = b.dataset;
        if (d.trPessoa) { troca = { modo: "montar", com: d.trPessoa, nomeCom: usuario(d.trPessoa).n || d.trPessoa, dou: null, quero: null }; desenharTroca(); painel.scrollTop = 0; return; }
        if (d.trVoltar != null || d.trNova != null) { troca = null; el.querySelector(".tr-b").classList.remove("tem"); desenharTroca(); return; }
        if (d.trDou) { const n = +d.trDou, cx = u.c || {}; troca.dou = [n, cx[n] && cx[n][1] > 0 && cx[n][0] === cx[n][1] ? 1 : 0]; desenharTroca(); return; }
        if (d.trQuero) { const n = +d.trQuero, cx = usuario(troca.com).c || {}; troca.quero = troca.quero && troca.quero[0] === n ? null : [n, cx[n] && cx[n][1] > 0 && cx[n][0] === cx[n][1] ? 1 : 0]; desenharTroca(); return; }
        if (d.trMeu) { const n = +d.trMeu, cx = u.c || {}; troca.quero = [n, cx[n] && cx[n][1] > 0 && cx[n][0] === cx[n][1] ? 1 : 0]; desenharTroca(); return; }
        if (d.trPropor != null && troca.dou) { mandar(`!trade @${troca.com} ${cmdPk(troca.dou)}${troca.quero ? " por " + cmdPk(troca.quero) : ""}`); troca.modo = "enviada"; desenharTroca(); return; }
        if (d.trCancelar != null) { mandar("!trade cancelar"); troca = null; desenharTroca(); return; }
        if (d.trRecusar != null) { mandar("!trade recusar"); troca = null; el.querySelector(".tr-b").classList.remove("tem"); abrirPainel(""); return; }
        if (d.trAceitar != null && troca.quero) {
          mandar("!trade aceitar" + (troca.semPor ? " " + cmdPk(troca.quero) : ""));
          troca.modo = "feita"; el.querySelector(".tr-b").classList.remove("tem");
          // quem recebe mostra: o que ganha (dou do outro) ⇄ o que dá
          desenharTroca(); return;
        }
        if (b.dataset.bolha) { const id = b.dataset.bolha; mandar("!bolha " + id); u.bh = [(u.bh || [[]])[0] || [], id === "equipe" ? "" : id];
          const lb = ler("usum_bolhas", {}); lb[eu] = { tem: u.bh[0], usa: u.bh[1] }; gravar("usum_bolhas", lb); desenharPainel("bolha"); return; }
        if (b.dataset.bola) { const k = b.dataset.bola; mandar("!ball " + k); u.eq = k; desenharPainel("bola"); erro(""); return; }
        if (b.dataset.parc) {
          const n = +b.dataset.parc, sh = b.dataset.sh === "1";
          mandar(`!pokemon ${nomeP(n).toLowerCase()}${sh ? " shiny" : ""}`);
          const novo = { num: n, shiny: sh, forma: USUM.formaRegional ? USUM.formaRegional(n) : "" };
          const todos = ler("usum_parceiros", {}); todos[eu] = novo; gravar("usum_parceiros", todos);
          const loc = ler("usum_parc_local", {}); loc[eu] = { p: novo, t: Date.now() }; gravar("usum_parc_local", loc);
          emoAtual = ""; carinha(""); desenharPainel("time"); return;
        }
        if (b.dataset.edita != null) { editando = +b.dataset.edita; desenharPainel("time"); painel.scrollTop = 0; const bu = painel.querySelector(".busca"); if (bu && matchMedia("(pointer:fine)").matches) bu.focus(); return; }
        if (b.dataset.voltar != null) { editando = -1; desenharPainel("time"); return; }
        const time = meuTime().map((x) => x.slice());
        if (b.dataset.tirar != null) { time.splice(editando, 1); salvarTime(time); editando = -1; desenharPainel("time"); return; }
        if (b.dataset.poe || b.dataset.digitado != null) {
          let n;
          if (b.dataset.poe) n = +b.dataset.poe;
          else { const p = USUM.lerPokemon((painel.querySelector(".busca") || {}).value || ""); if (!p) { erro("Não conheço esse Pokémon"); return; } n = p.num; }
          const cx = u.c || {}, sh = !!(cx[n] && cx[n][1] > 0 && cx[n][0] === cx[n][1]);   // só shiny se todos dessa espécie forem shiny
          const novo = [n, sh ? 1 : 0], ja = time.findIndex((x) => x[0] === n);
          if (ja !== editando) {
            if (ja >= 0) { if (time[editando]) time[ja] = time[editando]; else time.splice(ja, 1); }   // já estava em outro slot: troca de lugar
            if (editando < time.length) time[editando] = novo; else time.push(novo);
          }
          salvarTime(time.slice(0, 6)); editando = -1; desenharPainel("time"); erro(""); return;
        }
      });
      el.querySelectorAll(".abre").forEach((b) => b.onclick = () => { editando = -1; abrirPainel(painel.dataset.p === b.dataset.p ? "" : b.dataset.p); });
      el.querySelectorAll(".compor button[data-t]").forEach((b) => b.onclick = () => {
        if (b.dataset.semMel) { erro("Você não tem Mel na mochila 🍯"); return; }
        let t = b.dataset.t; erro("");
        if (t === "!mel" || t === "!hipermel") { if (t === "!mel") melGasto++; else hiperGasto++; setTimeout(atualizarMel, 50); }
        // a Twitch bloqueia mensagem igual repetida em 30 s; o número no fim deixa cada ataque diferente (o overlay ignora)
        if (t === "!atacar") { b._n = ((b._n || 0) % 9) + 1; t = "!atacar " + b._n; }
        if (ws && ws.readyState === 1) ws.send(`PRIVMSG #${canal} :${t}`); else { fila.push(t); conectar(); }
        b.classList.remove("ok"); void b.offsetWidth; b.classList.add("ok");
        const espera = { "!atacar": 5000, "!capturar": 4000 }[b.dataset.t];   // Atacar: 1 a cada 5 s na Raid (ataque forte). Capturar: 4 s
        if (espera) { b.disabled = true; const t0 = Date.now(), txt = b.textContent;
          const tk = setInterval(() => { const f = Math.ceil((espera - (Date.now() - t0)) / 1000); if (f <= 0) { clearInterval(tk); b.disabled = false; b.textContent = txt; } else b.textContent = txt + " (" + f + ")"; }, 200); }
      });
      el.querySelector("form").onsubmit = (e) => {
        e.preventDefault();
        const t = inp.value.replace(/[\r\n]+/g, " ").trim(); if (!t) return;
        erro("");
        if (ws && ws.readyState === 1) ws.send(`PRIVMSG #${canal} :${t}`); else { fila.push(t); conectar(); }
        inp.value = ""; carinha("");
      };
      conectar();
    }
    desenhar();
    // o parceiro pode mudar (dados novos da live): atualiza a fotinha de vez em quando
    setInterval(() => { if (eu && !el.querySelector("input").value) { emoAtual = ""; carinha(""); } }, 60000);
  }
})();
</script>
