<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c24">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chat da live</title>
<link rel="stylesheet" href="overlay/style.css">
<style>
  html, body { margin: 0; width: 100% !important; height: 100%; height: 100dvh; overflow: hidden; background: #140c24; }
  /* chat desprendido: barrinha em cima com "tela cheia" e "voltar ao site" */
  .barra-janela { display: none; }
  body.janela .barra-janela { display: flex; position: fixed; left: 0; right: 0; top: 0; z-index: 30; height: 40px; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 10px; padding-top: env(safe-area-inset-top); background: #1d1233; box-shadow: 0 2px 10px rgba(0,0,0,.35); font: 600 13px "Fredoka", "Poppins", sans-serif; color: #fff; }
  body.janela .barra-janela button, body.janela .barra-janela a { border: 0; border-radius: 10px; padding: 6px 12px; background: rgba(255,255,255,.12); color: #fff;
    font: inherit; text-decoration: none; cursor: pointer; }
  body.janela #chat { top: calc(48px + env(safe-area-inset-top)); bottom: calc(10px + env(safe-area-inset-bottom)); }
  body.janela.cheia .barra-janela .tela-cheia { display: none; }
  @media (pointer: fine) { body.janela .barra-janela .voltar { display: none; } }
  body.solo { width: 100%; height: 100%; }
  #chat { left: 10px; top: 10px; right: 10px; bottom: 10px; }
  /* no celular / painel estreito: tudo um pouco menor */
  @media (max-width: 420px) { body { zoom: .85; } }
  /* caixa de escrever dentro do próprio overlay */
  .compor { flex: none; margin: 8px 12px 12px; position: relative; z-index: 2; }
  .compor .entrar { width: 100%; border: 0; cursor: pointer; padding: 12px; border-radius: 18px; font: 600 15px "Fredoka", "Poppins", sans-serif; color: #fff;
    background: linear-gradient(90deg, rgba(255,170,60,.85), rgba(150,110,255,.85)); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .compor .caixa { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 8px; border-radius: 20px;
    background: rgba(20,12,40,.72); backdrop-filter: blur(8px); box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.12); }
  .compor .caixa:focus-within { box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,200,120,.55), 0 0 18px rgba(255,190,120,.25); }
  .compor .mini-av { width: 52px; height: 52px; flex: none; border-radius: 16px; display: grid; place-items: center; overflow: hidden; background: rgba(255,255,255,.08); }
  .compor .mini-av img { width: 50px; height: 50px; object-fit: contain; image-rendering: pixelated; border-radius: 14px; }
  .compor .mini-av img.ovo { width: 34px; height: 34px; }
  .compor .meio { flex: 1; min-width: 0; display: grid; gap: 2px; }
  .compor .rot { font: 500 11.5px "Poppins", sans-serif; color: rgba(255,255,255,.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .compor .rot b { color: #ffd88a; font-weight: 600; }
  .compor input { width: 100%; border: 0; outline: none; background: transparent; color: #fff; font: 500 15px "Poppins", sans-serif; padding: 2px 0; }
  .compor input::placeholder { color: rgba(255,255,255,.45); }
  .compor .enviar { flex: none; width: 42px; height: 42px; border: 0; border-radius: 14px; cursor: pointer; color: #fff; font-size: 18px;
    background: linear-gradient(135deg, #ffb347, #b07cff); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .compor .enviar:active { transform: scale(.94); }
  .compor .pe { display: flex; justify-content: space-between; margin: 5px 6px 0; font: 11px "Poppins", sans-serif; color: rgba(255,255,255,.5); }
  .compor .pe a { color: rgba(255,255,255,.6); }
  .compor .erro { color: #ffb3b3; }
</style>
</head>
<body class="solo">
  <div class="barra-janela"><a class="voltar" href="./">← Site</a><span>💬 Chat da live</span><button class="tela-cheia" type="button">⛶ Tela cheia</button></div>
  <div id="chat" class="moldura vidro"></div>
<script>
  // chat desprendido (?janela=1): no celular abre na aba inteira e dá para pôr em tela cheia
  (function () {
    if (!/[?&]janela=1/.test(location.search)) return;
    document.body.classList.add("janela");
    const b = document.querySelector(".tela-cheia"), raiz = document.documentElement;
    const pode = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
    if (!pode) b.style.display = "none";   // iPhone: sem tela cheia em site; dá para "Adicionar à Tela de Início"
    b.onclick = () => { try { (raiz.requestFullscreen || raiz.webkitRequestFullscreen).call(raiz, { navigationUI: "hide" }); } catch (e) {} };
    document.addEventListener("fullscreenchange", () => document.body.classList.toggle("cheia", !!document.fullscreenElement));
  })();
</script>
<script>
  // Configuração só do site: as imagens vêm direto da internet (não tem a pasta do PC aqui)
  window.USUM_CONFIG = {
    canal: "",
    chat: { maxMensagens: 30, mostrarParceiro: true },
    imagens: {
      pastaPMD: "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/",
      pmdOnline: "https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/",
      pastaHOME: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/"
    }
  };
  // os dados vêm da página principal (mesmo site); aberto sozinho, busca no Gist
  const pai = (() => { try { return window.parent !== window ? window.parent : null; } catch (e) { return null; } })();
  const dadosPai = () => { try { return pai && pai.__pokedexDados; } catch (e) { return null; } };
  const q = new URLSearchParams(location.search);
  window.USUM_CONFIG.canal = q.get("canal") || ((dadosPai() || {}).canal) || "";
</script>
<script src="pokedex.js"></script>
<script src="fitas-catalogo.js"></script>
<script>
  // avisos do overlay (capturas, fitas, eventos...) chegam pelos dados publicados
  window.USUM = window.USUM || {};
  USUM.FITAS = window.FITAS || [];
  const __ouvintes = [];
  USUM.aoFitaEvento = (fn) => __ouvintes.push(fn);
  USUM.__avisar = (ev) => __ouvintes.forEach((fn) => { try { fn(ev); } catch (e) { console.error(e); } });
</script>
<script src="overlay/poke.js"></script>
<script src="overlay/twitch.js"></script>
<script src="overlay/chat.js"></script>
<script>
(function () {
  const INICIAIS = new Set([722, 725, 728, 25, 133, 35]);
  const ler = (k, p) => { try { return JSON.parse(localStorage.getItem(k)) || p; } catch (e) { return p; } };
  const gravar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let D = null, ultimo = "";

  // copia o que a live publicou para o formato que o chat do overlay entende
  const abriu = Date.now(), jaVi = new Set();
  function semear(dados) {
    if (!dados || !dados.t || dados.em === ultimo) return;
    ultimo = dados.em; D = dados;
    // avisos recentes do overlay: mostra os que aconteceram desde pouco antes de abrir o chat
    (D.av || []).forEach((ev) => {
      if (!ev || jaVi.has(ev.k) || ev.t < abriu - 3 * 60e3) return;
      jaVi.add(ev.k); setTimeout(() => USUM.__avisar(ev), 50);
    });
    const parc = {}, times = {}, bolas = {};
    Object.entries(D.t).forEach(([l, u]) => {
      if (u.p && u.p[0]) parc[l] = { num: u.p[0], shiny: !!u.p[1], forma: "" };
      if (u.t) times[l] = u.t;
      if (u.eq) bolas[l] = u.eq;
    });
    gravar("usum_parceiros", parc); gravar("usum_times", times); gravar("usum_bolas", bolas);
    if (D.pl) gravar("usum_placar", D.pl);
    // quem comprou filme do cartaz (balão de ingresso): [nome, [logins], posição na lista]
    const cz = []; (D.cz || []).forEach(([nome, quem, pos]) => { cz[pos] = { nome, quem }; });
    gravar("usum_cartaz", { filmes: Array.from(cz, (f) => f || { nome: "", quem: [] }) });
  }
  const usuario = (l) => (D && D.t && D.t[l]) || {};
  USUM.urlFita = (id) => "assets/fitas/" + id + ".png";
  // igual ao overlay: a fita escolhida com !fita; se não escolheu, a mais recente que ganhou
  USUM.fitaDe = (l) => { const u = usuario(l), f = u.f || []; return (u.fe && f.includes(u.fe) ? u.fe : f[f.length - 1]) || ""; };
  USUM.nomeTreinador = (l) => usuario(l).n || l;
  USUM.amizade = (a, b) => { const x = (usuario(a).am || []).find((e) => e[0] === b); return { pontos: x ? 1 : 0, nivel: x ? x[1] : 0 }; };

  async function buscarGist() {
    const g = q.get("g"); if (!g) return;
    try {
      const r = await fetch("https://api.github.com/gists/" + g, { cache: "no-store" });
      const j = await r.json(), f = j.files && j.files["dados.json"];
      let txt = f && f.content; if (f && f.truncated) txt = await (await fetch(f.raw_url)).text();
      semear(JSON.parse(txt || "{}"));
    } catch (e) {}
  }

  // comandos: só os que dão pra mostrar na hora sem estragar nada (o overlay da live é quem manda de verdade)
  function aoComando(m, cmd, txt, aviso) {
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    if (cmd === "!sol" || cmd === "!lua") {
      const t = ler("usum_times", {}), time = cmd.slice(1);
      if (t[m.login] && t[m.login] !== time) return;   // trocar de equipe só na próxima live: quem manda é o overlay
      if (t[m.login] !== time) { t[m.login] = time; gravar("usum_times", t);
        aviso(time, `<b>${esc(m.nome)}</b> entrou para a Equipe ${time === "sol" ? "Sol" : "Lua"}!`); }
      return;
    }
    // trocas: mostra a proposta e a resposta na hora (o resultado chega depois pelos dados da live)
    if (cmd === "!trade" || cmd === "!troca" || (cmd === "!trocar" && !/^!trocar\s+\d/.test(txt))) {
      const arg = txt.slice(cmd.length).trim(), ac = (arg.split(/\s+/)[0] || "").toLowerCase(), t = ler("usum_times", {})[m.login];
      if (/^(aceitar|aceito|sim|ok)$/.test(ac)) { aviso(t, `🔁 <b>${esc(m.nome)}</b> aceitou a troca!`); return; }
      if (/^(recusar|recuso|nao|não|n)$/.test(ac)) { aviso(t, `<b>${esc(m.nome)}</b> recusou a troca`); return; }
      if (/^(cancelar|cancela)$/.test(ac)) { aviso(t, `<b>${esc(m.nome)}</b> cancelou a troca`); return; }
      const mm = arg.match(/^@?(\w+)\s+(.+)$/); if (!mm) return;
      const [a, b] = mm[2].split(/\s+(?:por|pelo|pela|for)\s+/i);
      const pa = USUM.lerPokemon((a || "").replace(/\s+\d+$/, "")), pb = b ? USUM.lerPokemon(b.replace(/\s+\d+$/, "")) : null;
      if (!pa) return;
      aviso(t, `📦 <b>${esc(mm[1])}</b>, ${esc(m.nome)} quer trocar ${esc(pa.nome)}${pb ? ` pelo seu ${esc(pb.nome)}` : " com você"}! Responda <b>!trade aceitar</b> ou <b>!trade recusar</b>`, { num: pa.num, forma: "", shiny: !!pa.shiny });
      return;
    }
    if (cmd === "!pokemon" || cmd === "!parceiro") {
      const p = USUM.lerPokemon(txt.slice(cmd.length)); if (!p) return;
      const cx = usuario(m.login).c || {}, tem = cx[p.num];
      if (!m.dono && !INICIAIS.has(p.num) && !tem) return;
      p.shiny = !!(p.shiny && (m.dono || (tem && tem[1])));
      const todos = ler("usum_parceiros", {}); todos[m.login] = { num: p.num, forma: p.forma, shiny: p.shiny }; gravar("usum_parceiros", todos);
      aviso(ler("usum_times", {})[m.login], `<b>${esc(m.nome)}</b> escolheu ${esc(p.nome)}${p.shiny ? " ✦ shiny" : ""}!`, p);
    }
  }

  semear(dadosPai());
  if (!D) buscarGist();
  setInterval(() => semear(dadosPai()), 20000);
  if (!pai) setInterval(buscarGist, 5 * 60000);
  USUM.chat(document.getElementById("chat"), { espelho: true, aoComando });

  /* ---- escrever no chat sem sair do overlay (login da Twitch feito pela página principal) ---- */
  const CLIENT = q.get("cid") || "";
  if (CLIENT) {
    const canal = (window.USUM_CONFIG.canal || "").toLowerCase();
    const NOMES = { Normal: "normal", Happy: "feliz", Joyous: "rindo", Angry: "bravo", Shouting: "gritando", Sad: "triste", Crying: "chorando",
      "Teary-Eyed": "emocionado", Worried: "preocupado", Surprised: "surpreso", Stunned: "chocado", Pain: "com careta", Sigh: "suspirando",
      Dizzy: "tonto", Determined: "determinado", Inspired: "inspirado" };
    const el = document.createElement("div"); el.className = "compor";
    document.getElementById("chat").appendChild(el);
    const lerTok = () => { try { return (JSON.parse(localStorage.getItem("pokedex_twitch")) || {}).token || ""; } catch (e) { return ""; } };
    let eu = null, ws = null, fila = [], img = null, emoAtual = "";
    const topo = (() => { try { return window.top; } catch (e) { return window; } })();
    function entrar() {
      let volta = topo.location.origin + topo.location.pathname;
      // chat desprendido (janela própria): o login volta para o site e o site manda de volta para cá
      if (topo === window && /chat\.html$/.test(location.pathname)) {
        volta = location.origin + location.pathname.replace(/chat\.html$/, "");
        try { localStorage.setItem("pokedex_volta_chat", JSON.stringify({ url: location.href, t: Date.now() })); } catch (e) {}
      }
      const u = new URL("https://id.twitch.tv/oauth2/authorize");
      u.search = new URLSearchParams({ response_type: "token", client_id: CLIENT, redirect_uri: volta, scope: "chat:read chat:edit",
        state: Math.random().toString(36).slice(2) }).toString();
      topo.location.href = u.toString();
    }
    function sair() { try { localStorage.removeItem("pokedex_twitch"); } catch (e) {} eu = null; if (ws) ws.close(); ws = null; desenhar(); }
    const erro = (t) => { const e = el.querySelector(".erro"); if (e) e.textContent = t || ""; };
    function conectar() {
      if (ws || !eu) return;
      ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
      ws.onopen = () => { ws.send("PASS oauth:" + lerTok()); ws.send("NICK " + eu); ws.send("JOIN #" + canal); };
      ws.onmessage = (ev) => ev.data.split("\r\n").forEach((l) => {
        if (l.startsWith("PING")) ws.send("PONG :tmi.twitch.tv");
        else if (/ 001 /.test(l)) { fila.forEach((t) => ws.send(`PRIVMSG #${canal} :${t}`)); fila = []; }
        else if (/ NOTICE /.test(l)) {
          const t = l.split(" :").slice(-1)[0];
          if (/authentication failed|improperly formatted auth/i.test(t)) { sair(); }
          else erro(t);
        }
      });
      ws.onclose = () => { ws = null; };
    }
    // a fotinha do seu parceiro muda de carinha enquanto você digita: você vê como vai ficar antes de mandar
    function carinha(texto) {
      const emo = texto.trim() ? USUM.emocaoDoTexto(texto) : "Normal";
      const r = el.querySelector(".rot");
      if (r) r.innerHTML = `Seu parceiro vai ficar <b>${NOMES[emo] || "normal"}</b>`;
      if (emo === emoAtual) return; emoAtual = emo;
      const caixa = el.querySelector(".mini-av"); if (!caixa) return;
      const p = USUM.parceiroDe(eu);
      const novo = USUM.imgPokemon(p, emo); caixa.innerHTML = ""; caixa.appendChild(novo);
    }
    async function desenhar() {
      const tok = lerTok();
      if (tok && !eu) {
        try { const r = await fetch("https://id.twitch.tv/oauth2/validate", { headers: { Authorization: "OAuth " + tok } });
          if (r.ok) eu = (await r.json()).login; else localStorage.removeItem("pokedex_twitch"); } catch (e) {}
      }
      if (!eu) {
        el.innerHTML = `<button class="entrar">🔑 Entrar com a Twitch para conversar aqui</button>`;
        el.querySelector(".entrar").onclick = entrar; return;
      }
      el.innerHTML = `<form class="caixa"><div class="mini-av"></div><div class="meio"><span class="rot"></span>
          <input maxlength="500" placeholder="Mandar mensagem como ${eu}…" autocomplete="off"></div><button class="enviar" title="Enviar">➤</button></form>
        <div class="pe"><span>conversando como <b>${eu}</b> · <a href="#" class="sair">sair</a></span><span class="erro"></span></div>`;
      emoAtual = ""; carinha("");
      const inp = el.querySelector("input");
      inp.oninput = () => carinha(inp.value);
      el.querySelector(".sair").onclick = (e) => { e.preventDefault(); sair(); };
      el.querySelector("form").onsubmit = (e) => {
        e.preventDefault();
        const t = inp.value.replace(/[\r\n]+/g, " ").trim(); if (!t) return;
        erro("");
        if (ws && ws.readyState === 1) ws.send(`PRIVMSG #${canal} :${t}`); else { fila.push(t); conectar(); }
        inp.value = ""; carinha("");
      };
      conectar();
    }
    desenhar();
    // o parceiro pode mudar (dados novos da live): atualiza a fotinha de vez em quando
    setInterval(() => { if (eu && !el.querySelector("input").value) { emoAtual = ""; carinha(""); } }, 60000);
  }
})();
</script>
</body>
</html>
